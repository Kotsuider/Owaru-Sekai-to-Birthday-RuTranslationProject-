[package]
name = "patch_menu"
version = "1.0.0"
edition = "2021"

[dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
